name: Build Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build . --file Dockerfile --tag camara-ia:latest

      - name: Save image as tar file
        run: |
          docker save camara-ia:latest -o camara-ia.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camara-ia-image
          path: camara-ia.tar
